<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NAVIS Mobile</title>
  <style>
    :root {
      --bg: #040b17;
      --bg-panel: #091528;
      --bg-card: rgba(15, 31, 56, 0.78);
      --border: rgba(114, 177, 255, 0.16);
      --text: #e8f1fa;
      --muted: #8ea5c2;
      --accent: #3fd0c9;
      --accent-ink: #04201f;
      --danger: #ff6b7a;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top right, #0d2240 0%, #040b17 58%, #02060d 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* Top Status Bar */
    #status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(4, 11, 23, 0.85);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }

    .sb-brand {
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .sb-pills {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill {
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
    }

    .pill.on {
      color: var(--accent);
      border-color: rgba(63, 208, 201, 0.45);
      background: rgba(63, 208, 201, 0.1);
    }

    /* Main Screen Viewport */
    #viewport {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }

    /* Home Grid */
    .hero-card {
      background: linear-gradient(135deg, rgba(63, 208, 201, 0.16), rgba(14, 34, 64, 0.85));
      border: 1px solid rgba(63, 208, 201, 0.28);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }

    .hero-time {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .hero-sub {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 8px;
      border-radius: var(--radius);
      background: var(--bg-card);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease;
    }

    .tile:active {
      transform: scale(0.96);
      border-color: var(--accent);
    }

    .tile-icon {
      font-size: 28px;
      line-height: 1;
    }

    .tile-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
    }

    /* Active App Header */
    #app-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #app-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Shared UI Primitives */
    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 11px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .in {
      width: 100%;
      padding: 10px 12px;
      margin-top: 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(3, 9, 20, 0.85);
      color: var(--text);
      font-size: 14px;
      outline: none;
      user-select: text;
    }

    .in:focus {
      border-color: var(--accent);
    }

    .btn {
      padding: 9px 13px;
      margin-top: 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:active {
      opacity: 0.85;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .btn.p {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
      font-weight: 700;
    }

    small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      display: block;
    }

    h3 {
      margin: 14px 0 6px;
      font-size: 14px;
      color: var(--accent);
    }

    /* Bottom Dock */
    #dock {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 8px 12px;
      background: rgba(4, 11, 23, 0.92);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .dock-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    .dock-btn:active {
      background: rgba(255, 255, 255, 0.08);
    }

    /* Toast */
    #toast {
      position: fixed;
      left: 50%;
      bottom: 64px;
      transform: translateX(-50%) translateY(16px);
      background: #102442;
      color: var(--text);
      border: 1px solid rgba(63, 208, 201, 0.45);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 9999;
      max-width: 88%;
      text-align: center;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div id="shell">
    <div id="status-bar">
      <span class="sb-brand">NAVIS OS</span>
      <div class="sb-pills">
        <span id="pill-wifi" class="pill" title="Wi-Fi Status">📶 Wi-Fi</span>
        <span id="pill-bt" class="pill" title="Bluetooth Status">🔵 BT</span>
        <span id="sb-clock" style="font-weight:700;margin-left:4px">--:--</span>
      </div>
    </div>

    <div id="app-header">
      <div id="app-title"></div>
      <button id="app-home-btn" class="btn" style="margin-top:0;padding:6px 12px">Home</button>
    </div>

    <div id="viewport"></div>

    <div id="dock">
      <button class="dock-btn" onclick="openApp('phone')">📞 Phone</button>
      <button class="dock-btn" onclick="goHome()">⌂ Home</button>
      <button class="dock-btn" onclick="openApp('browser')">🌐 Browser</button>
      <button class="dock-btn" onclick="openApp('pixora')">✦ Pixora</button>
    </div>
  </div>

  <div id="toast"></div>
  <script>
    
  
  </script>
</body>
</html>
