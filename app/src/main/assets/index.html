<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAVIS Mobile — Shell Prototype</title>

<style>
:root{--bg:#030814;--glass:rgba(16,28,46,.8);--fg:#e8f1fa;--mut:#8fa3b8;--line:rgba(255,255,255,.12);--ac:#3fd0c9;--wp:radial-gradient(500px 420px at 20% 8%,#1a4a78 0,transparent 65%),radial-gradient(500px 420px at 90% 95%,#0e6360 0,transparent 60%),#07101c;--sheet:#0b1626;box-sizing:border-box}
:root[data-theme=light]{--bg:#cfd9e4;--glass:rgba(255,255,255,.82);--fg:#10202f;--mut:#566a7e;--line:rgba(0,0,0,.14);--wp:radial-gradient(500px 420px at 20% 8%,#b9deff 0,transparent 65%),radial-gradient(500px 420px at 90% 95%,#b8f2e6 0,transparent 60%),#e6eef6;--sheet:#f3f7fb}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
#ph{position:relative;width:min(100vw,390px);height:min(100dvh,844px);overflow:hidden;background:var(--wp);border-radius:clamp(0px,calc((100vw - 400px)*9),38px);box-shadow:0 30px 80px rgba(0,0,0,.45)}
#wp,.l{position:absolute;inset:0}
#sb{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 18px 6px;display:flex;justify-content:space-between;font-size:12px;font-weight:600;z-index:60;cursor:pointer;touch-action:none}
#home{overflow-y:auto;padding:60px 18px 150px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px;align-content:start}
.ic{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;cursor:pointer;font-size:11px}
.ic i{font-style:normal;width:54px;height:54px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px)}
.ic.off{opacity:.4}
.sheet{position:absolute;inset:0;background:var(--sheet);z-index:20;display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top,0px) + 34px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px) scale(.96);opacity:0}}
.sheet h2{margin:0;padding:6px 18px 10px;font-size:20px;font-weight:600}
.bd{flex:1;overflow:auto;padding:0 18px 70px;display:flex;flex-direction:column}
#nav{position:absolute;bottom:0;left:0;right:0;height:calc(46px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:space-around;align-items:center;z-index:56;background:var(--glass);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
#nav button{background:none;border:0;width:70px;height:36px;font-size:18px;cursor:pointer;border-radius:12px}
#shade,#rec{position:absolute;left:0;right:0;z-index:55;background:var(--glass);backdrop-filter:blur(26px);transition:transform .25s}
#shade{top:0;padding:calc(env(safe-area-inset-top,0px) + 40px) 16px 16px;border-radius:0 0 24px 24px;transform:translateY(-110%)}#shade.on{transform:none}
#rec{inset:0;padding:calc(env(safe-area-inset-top,0px) + 50px) 16px 70px;display:none;flex-direction:column;gap:10px;overflow:auto}
.card{padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(127,127,127,.12);display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(127,127,127,.14);cursor:pointer}.btn.p{background:var(--ac);color:#04201f;border:0;font-weight:600}
.btn:focus-visible,.ic:focus-visible,#nav button:focus-visible{outline:2px solid var(--ac)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer}.sw.on{border-color:var(--fg)}
#lock,#boot{z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--wp);text-align:center}
#lock{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
.big{font-size:64px;font-weight:300;line-height:1}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:12px;margin-top:14px}.pad button{height:56px;border-radius:50%;border:1px solid var(--line);background:var(--glass);font-size:20px;cursor:pointer}
.dots{display:flex;gap:12px;height:14px}.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--fg)}.dots i.f{background:var(--fg)}
.bar{width:160px;height:3px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);animation:ld 2s ease-out forwards}@keyframes ld{to{width:100%}}
.cd{text-align:right;font-size:34px;padding:12px;border-radius:14px;background:rgba(127,127,127,.14);min-height:46px;word-break:break-all}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.cg button{padding:16px 0;border-radius:14px;border:1px solid var(--line);background:rgba(127,127,127,.12);font-size:18px;cursor:pointer}.cg .op{background:var(--ac);color:#04201f}
textarea.nt{flex:1;resize:none;background:transparent;border:0;outline:0;line-height:1.6;font-size:15px}
#toast{position:absolute;top:calc(env(safe-area-inset-top,0px) + 34px);left:14px;right:14px;z-index:70;padding:12px 14px;border-radius:16px;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--line);transform:translateY(-200%);opacity:0;pointer-events:none;transition:transform .3s,opacity .3s}#toast.on{transform:none;opacity:1}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:90}
small{color:var(--mut)}
.sheet{font-size:var(--fs,14px)}
.tile{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:17px;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 6px rgba(0,0,0,.28)}.tile.s{width:38px;height:38px;border-radius:12px}.tile.xl{width:64px;height:64px;border-radius:20px}.ic i.tile{border:0;backdrop-filter:none}.bd h3{margin:18px 0 0;font-size:13px;color:var(--mut);font-weight:600}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}
iframe{border:0;flex:1;width:100%;background:#fff;border-radius:12px}
.msg{padding:8px 12px;border-radius:14px;margin:4px 0;max-width:85%;width:fit-content}.msg.u{margin-left:auto;background:var(--ac);color:#04201f}.msg.a{background:rgba(127,127,127,.18)}
.in{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:transparent;width:100%;box-sizing:border-box;margin:8px 0}
a.btn{text-decoration:none;color:inherit;display:inline-block}select.btn{background:var(--sheet)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style></head><body>
<div id="ph">
<div id="wp" class="l"></div>
<div id="sb"><span id="t">--:--</span><span id="bat"></span></div>
<div id="home" class="l"></div>
<div id="shade"></div><div id="rec"></div>
<div id="toast"></div>
<div id="nav"><button id="bk" title="Back" aria-label="Back">‹</button><button id="hm" title="Home" aria-label="Home">●</button><button id="rc" title="Recent apps" aria-label="Recent apps">▭</button></div>
<div id="lock" class="l"></div><div id="boot" class="l"></div><div id="dim"></div>
</div>
<script>
const $=(s,e=document)=>e.querySelector(s),mk=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
let S={};try{S=JSON.parse(localStorage.navisM||'{}')}catch(e){}
const save=()=>{try{localStorage.navisM=JSON.stringify(S)}catch(e){}};
const hx=async(p,s)=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const WP={Deep:'',Aurora:'radial-gradient(500px 420px at 80% 8%,#6d3fd0 0,transparent 65%),radial-gradient(500px 420px at 10% 95%,#0f7a8a 0,transparent 60%),#0a0f1e',Dune:'radial-gradient(500px 420px at 20% 90%,#d98a4a 0,transparent 65%),radial-gradient(500px 420px at 90% 8%,#7a3a5a 0,transparent 60%),#1b1020'};
function look(){const r=document.documentElement;r.dataset.theme=S.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');r.style.setProperty('--ac',S.ac||'#3fd0c9');const wv=(S.wp==='Custom'&&S.wpc)?'center/cover no-repeat url('+S.wpc+')':(WP[S.wp]||'');$('#ph').style.background=wv;r.style.setProperty('--wp',wv);$('#dim').style.opacity=(S.dim||0)/100;r.style.setProperty('--fs',S.lg?'18px':'14px')}
const LOGO='<svg width="76" height="76" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--ac)" stroke-width="2.5"/><path d="M50 12 L60 50 L50 88 L40 50Z" fill="var(--ac)"/><path d="M12 50 L50 40 L88 50 L50 60Z" fill="none" stroke="var(--fg)" stroke-width="2"/></svg>';
let notes=[];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t.k);t.k=setTimeout(()=>t.classList.remove('on'),2600)}
function notify(m){notes.unshift({m,t:new Date()});toast(m);drawShade()}
function drawShade(){const s=$('#shade');s.innerHTML='<div class="row"><span>Theme</span></div>';const th=mk('button','btn','Light / Dark');th.onclick=()=>{S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();look()};$('.row',s).append(th);
const br=mk('div','row','<span>Brightness</span>');const r=mk('input');r.type='range';r.min=0;r.max=70;r.value=70-(S.dim||0);r.oninput=()=>{S.dim=70-r.value;save();look()};br.append(r);s.append(br);
const lk=mk('button','btn p','Lock now');lk.style.margin='12px 0';lk.onclick=()=>{s.classList.remove('on');lockNow()};s.append(lk);
s.append(mk('div','','<small>Notifications</small>'));if(!notes.length)s.append(mk('div','','<small>Nothing new.</small>'));
notes.slice(0,5).forEach(n=>s.append(mk('div','card',`<span>${n.m.replace(/</g,'&lt;')}</span><small>${n.t.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</small>`)));
if(notes.length){const c=mk('button','btn','Clear all');c.style.marginTop='8px';c.onclick=()=>{notes=[];drawShade()};s.append(c)}}
function tick(){const d=new Date();$('#t').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});const lt=$('#lt');if(lt){lt.textContent=$('#t').textContent;$('#ld').textContent=d.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'})}}

  };
  const doSms=(num,body)=>{
    const p=(num||'').trim(),t=(body||'').trim();
    if(!p)return toast('Enter a phone number.');
    if(!t)return toast('Type a message first.');
    V.msgs.unshift({type:'sms',to:p,text:t,at:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
    V.msgs=V.msgs.slice(0,30);saveV();
    if(bridge&&bridge.sendSms){bridge.sendSms(p,t);toast('SMS sent to '+p)}

  };
  const draw=()=>{
    b.innerHTML='';
    b.append(mk('small','','NAVIS Phone · Direct calling & SMS inside NAVIS Mobile. Contacts & logs stay encrypted.'));

      const ta=mk('textarea','in');ta.rows=3;ta.placeholder='Write SMS message…';ta.style.resize='vertical';
      const sendBtn=mk('button','btn p','Send SMS');
      sendBtn.onclick=()=>{doSms(n.value,ta.value);msgOpen=false;draw()};

  files(b){
  V.files=V.files||[

if(setup){if(first===null){first=pin;pin='';return draw('Confirm your PIN')}if(first!==pin){first=null;pin='';return draw('PINs didn’t match. Choose a PIN')}S.s=crypto.randomUUID();S.h=await hx(pin,S.s);save();K=await dk(pin,S.s);if(S.n){V.n=S.n;delete S.n}await saveV();L.style.display='none';rst()}
else if(await hx(pin,S.s)===S.h){await unlock(pin)}else{pin='';draw('Wrong PIN. Try again')}})};
draw(setup?'Choose a 4-digit PIN':'Enter PIN')}
$('#boot').innerHTML=LOGO+'<div style="letter-spacing:.4em;font-weight:600">NAVIS</div><small>Navigate Beyond Limits.</small><div class="bar"><i></i></div>';
look();grid();tick();setInterval(tick,1000);
if(navigator.getBattery)navigator.getBattery().then(b=>{const u=()=>$('#bat').textContent=Math.round(b.level*100)+'%';u();b.onlevelchange=u}).catch(()=>{});
setTimeout(()=>{$('#boot').style.display='none';lockNow()},2100);
</script></body></html>
